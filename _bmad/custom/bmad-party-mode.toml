# mot pour mot dans sa persona (« tu le fais échouer une fois pour montrer qu'il
# garde vraiment quelque chose »). Deux voix pour une exigence, c'est une place
# perdue, pas une garantie doublée. Sa part propre — le canal de test de la CIBLE
# plutôt qu'un framework plaqué (R3) — revient au relais du projet, que la scène
# fait inviter. Garde-fou reste convocable au conseil de flotte, en mise en service
