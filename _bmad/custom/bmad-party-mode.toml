# SALLE DE VEILLE (demande utilisateur 2026-09-01).
# -------------------------------------------------------------------------
# Le hub avait un COLLECTEUR (sous-agent veille-agentic) et un ARBITRE (conseil-flotte),
# mais personne pour QUALIFIER la matière entre les deux. Conséquence mesurée : une
# trouvaille annonçant « BMAD v7 » est restée 34 jours en attente alors que la v7
# n'était pas sortie — le tri annoncé/sorti n'était la responsabilité de personne.

[[workflow.party_groups]]
id = "observatoire-agentic"
skills_bmad = ["bmad-deep-recon"]
name = '''Observatoire des pratiques agentic'''
members = ["veille", "claim-checker", "consensus-challenger", "cadrage", "intendance"]
scene = '''Qualifier l'ÉTAT DE L'ART agentic lui-même, avant que quiconque propose de l'adopter. Balayage large et assumé : les pratiques des fournisseurs IA (Anthropic, OpenAI, Google, Mistral, Meta, GitHub et les autres), ce qui est en R&D et pas encore sorti, la littérature scientifique (articles à comité de lecture, preprints) et les publications d'ingénierie. La salle TRIE ce flux selon une échelle qui n'est jamais implicite : PROUVÉ (mesure reproductible ou papier évalué), SORTI (disponible et essayable aujourd'hui), ANNONCÉ (promis, pas livrable), HYPE (répété sans source primaire). À DISTINGUER de deux voisins : le sous-agent veille-agentic COLLECTE et écrit veille.json, il ne délibère pas ; le conseil-flotte ARBITRE l'adoption d'une pratique pour la flotte, en aval. Ici on ne décide pas d'adopter — on dit ce que la chose VAUT et ce qu'elle coûte à vérifier.'''
memory = true

redevabilites = [
  '''Chaque pratique rapportée est CLASSÉE sur l'échelle prouvé / sorti / annoncé / hype, et la classe est justifiée par sa source primaire.''',
  '''Une source est citée avec sa NATURE : papier à comité de lecture, preprint, documentation officielle, billet d'ingénierie, annonce commerciale. Les quatre ne pèsent pas pareil, et les confondre est la faute principale de cette salle.''',
  '''Ce que la flotte fait DÉJÀ est dit avant de s'enthousiasmer : une pratique déjà en place se constate, elle ne se découvre pas.''',
  '''Le coût de VÉRIFICATION est chiffré : ce qu'il faudrait faire pour savoir si la pratique tient chez nous.''',
  '''La documentation de la veille survit à la séance : ce qui a été écarté, et pourquoi, autant que ce qui a été retenu.''',
]
qualite_requise = '''Aucune pratique n'est présentée comme disponible sans que quelqu'un ait ouvert la source primaire ; une annonce de version n'est jamais comptée comme une sortie (leçon mesurée : une trouvaille « v7 annoncée » est restée 34 jours en attente d'arbitrage alors que la version n'existait pas). Un résultat scientifique est rapporté avec sa taille d'effet et ses conditions, pas avec son titre.'''
entrants = [
  '''Le périmètre de la veille : quelles familles de pratiques, sur quelle fenêtre de temps.''',
  '''Les sources brutes déjà collectées (veille.json du sous-agent veille-agentic, s'il a tourné).''',
  '''L'état mesuré de la flotte sur les pratiques concernées — sinon la salle compare à une flotte imaginaire.''',
  '''Les trouvailles encore non arbitrées et leur ancienneté : une veille qui empile sans trancher pourrit.''',
]

