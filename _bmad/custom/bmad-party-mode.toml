# -------------------------------------------------------------------------
# DEUX SALLES NEUVES (demandes utilisateur 2026-09-01).
# -------------------------------------------------------------------------
# Elles ne doublent pas leurs voisines et la frontiere est ecrite dans la scene :
# code-review-crew part d'un DIFF, inspection-critique d'un PERIMETRE et balaie
# l'existant sur quatre axes dont trois qu'aucune salle ne couvrait (design, UX,
# inutilise) ; mise-en-service est un GUICHET par release, socle-technique tient
# l'infrastructure DANS LA DUREE.

[[workflow.party_groups]]
id = "inspection-critique"
skills_bmad = ["bmad-review"]
name = '''Inspection critique'''
members = ["edge-hunter", "bmad-agent-ux-designer", "usager", "supervision", "intendance"]
scene = '''Passer l'existant au crible SANS qu'un incident l'ait demandé — c'est une revue de routine, pas une enquête. Quatre axes, et aucun ne doit manger les autres : (1) les bugs latents, ce qui casserait sur une entrée qu'on n'a jamais essayée ; (2) le design, ce qui est incohérent d'un écran ou d'un module à l'autre — UN TEXTE LONG AUTONOME (documentation, page publiée, communication) entre dans cet axe au même titre qu'un écran : la revue y porte la redondance, le hors-sujet, un désaveu interne (le texte se contredit lui-même), l'opacité ; (3) l'expérience de celui qui s'en sert, y compris quand il se trompe ; (4) ce qui n'est JAMAIS utilisé — code mort, écran jamais ouvert, option jamais choisie, skill jamais invoquée. Le quatrième axe est le plus rentable et le plus oublié : ce hub a mesuré 46 skills à 0 invocation sur 113 sessions, et neuf salles que personne ne convoquait. À DISTINGUER de code-review-crew, qui part d'un diff et attaque un changement précis : ici il n'y a pas de diff, il y a un périmètre et des mesures d'usage. Inviter le relais du projet visé. Sur un texte : arbitrage du 2026-09-18 (salle conseil-flotte) — « sonner IA » n'est PAS un critère opposable, aucune détection fiable et non contournable n'existe (arXiv:2303.11156, paraphrase récursive) ; le critère d'acceptation reste « le texte tient » (lentilles prose/structure de bmad-review réellement chargées), jamais « passe un détecteur ».'''
memory = true

redevabilites = [
  '''Les quatre axes sont TOUS traités : une inspection qui ne parle que de bugs est une revue de code déguisée.''',
  '''Ce qui n'est jamais utilisé est nommé avec sa mesure — « je crois que personne ne s'en sert » n'est pas un constat.''',
  '''Chaque constat porte son coût de statu quo : ce que ça coûte de ne rien faire, sinon tout se vaut.''',
  '''La documentation de ce qui est retiré survit au retrait : pourquoi c'était là, pourquoi ça part.''',
]
qualite_requise = '''Aucun axe n'est déclaré « rien à signaler » sans dire ce qui a été regardé pour le conclure ; et rien n'est proposé au retrait sans une fenêtre d'observation déclarée — un zéro d'usage sur une période non observée ne prouve pas l'inutilité, il prouve qu'on ne regardait pas.'''
entrants = [
  '''Le périmètre exact à inspecter — un projet, un module, un écran, UN TEXTE précis (un document, pas « la doc ») ; jamais « le code ».''',
  '''Les mesures d'usage de la période, avec leur fenêtre d'observation déclarée.''',
  '''La spec ou l'ADR d'origine des fonctionnalités suspectes : ce qui semble mort peut être une exigence dormante.''',
  '''L'inventaire de ce qui existe (écrans, options, skills, endpoints), pas seulement le code.''',
]

manifeste = [
  '''MODE — subagent, deux tours minimum. Un axe par voix au premier tour : quatre regards qui ne se contaminent pas.''',
  '''DÉROULÉ — (1) chaque voix balaie SON axe seule ; (2) Argus pose les mesures d'usage sur la table ; (3) confrontation : ce qu'une voix veut retirer, une autre doit pouvoir défendre ; (4) tri par coût du statu quo.''',
  '''DÉSACCORD — un retrait contesté reste PROPOSÉ, jamais arbitré en salle : le désaccord part tel quel à l'utilisateur.''',
  '''ARRÊT — quand les quatre axes ont rendu, ou quand la salle se met à re-débattre un constat déjà tranché (Killjoy peut être invité).''',
  '''JAMAIS — ne supprime rien, ne corrige rien, ne juge pas l'auteur ; et ne conclut aucune inutilité sur une période non observée.''',
]

[workflow.party_groups.sortants]
type = '''Rapport d'inspection à quatre axes + liste de retraits proposés'''
producteur = '''playbook dev-verifie (correctifs) ou evolution-flotte (dépôt cible) ; le retrait est un arbitrage utilisateur'''
recette = [
  '''Chaque axe porte au moins un constat OU la trace de ce qui a été regardé pour le clore.''',
  '''Chaque retrait proposé cite sa mesure d'usage ET la fenêtre observée qui la porte.''',
  '''Aucun retrait n'est appliqué sans arbitrage : la salle propose, elle ne supprime pas.''',
]

[[workflow.party_groups]]
id = "socle-technique"
skills_bmad = ["bmad-deep-recon"]
name = '''Socle technique'''
members = ["deploiement", "sec-hawk", "tokens", "intendance", "bmad-agent-architect"]
scene = '''Choisir l'environnement de production le mieux adapté, puis tenir l'infrastructure DANS LA DURÉE — pas seulement le jour de la sortie : parc d'environnements et ce qui les distingue, provisionnement et reproductibilité, secrets et leur rotation, coût de ce qui tourne, surveillance, sauvegarde et reprise après incident. À DISTINGUER de mise-en-service, qui est un guichet — « est-ce prêt à sortir ? », une fois, par release : ici la question est « ce socle tient-il, et à quel prix ? », et elle se repose sans qu'un déploiement la déclenche. Inviter le relais du projet dont l'infrastructure est discutée.'''
memory = true

redevabilites = [
  '''Chaque environnement est nommé avec ce qui le DISTINGUE des autres — deux environnements qu'on ne sait pas différencier n'en font qu'un.''',
  '''L'environnement de PRODUCTION est choisi, et le choix est écrit : ce qu'il coûte, ce qu'il impose en exploitation, et ce qu'on abandonne en le prenant. Un environnement subi parce qu'il était déjà là se repaie à chaque incident.''',
  '''Le coût de ce qui tourne est chiffré, y compris ce qui tourne sans être utilisé.''',
  '''La reprise après incident est décrite ET datée de son dernier essai réel : une procédure jamais jouée est une hypothèse.''',
  '''La documentation d'exploitation est tenue à jour avec l'infrastructure, pas après elle.''',
]
qualite_requise = '''Rien n'est déclaré « en place » sur la foi d'un fichier de configuration : l'état réel est constaté sur l'environnement concerné. Aucun secret n'apparaît en clair dans un compte rendu, et toute procédure de reprise citée dit quand elle a été jouée pour de vrai.'''
entrants = [
  '''L'inventaire des environnements existants et de ce qui les distingue.''',
  '''Les secrets et leur mode de rotation, sans leur valeur.''',
  '''Le coût mesuré de la période et ce qui le compose.''',
  '''L'ADR ou la spec d'infrastructure si le projet en porte un, et les incidents survenus depuis la dernière séance.''',
  '''Les contraintes qui bornent le choix d'environnement : localisation des données et conformité, budget réel, compétences disponibles pour l'exploiter.''',
]

manifeste = [
  '''MODE — subagent, deux tours. Le premier tour est un ÉTAT DES LIEUX, pas une proposition : on ne corrige pas un socle qu'on n'a pas décrit.''',
  '''DÉROULÉ — (1) Aiguilleur décrit le parc réel ; (2) Vex la surface d'exposition et les secrets, Jauge le coût, Quincaillier ce qui tourne pour rien ; (3) Winston dit vers quoi ça devrait aller ; (4) confrontation et tri par RISQUE, pas par facilité.''',
  '''DÉSACCORD — un risque contesté est chiffré ou requalifié en hypothèse ; il ne disparaît pas parce qu'il gêne.''',
  '''ARRÊT — quand le parc est décrit, les risques triés et le prochain pas nommé. Pas de plan à douze mois : la salle se re-convoque.''',
  '''JAMAIS — ne touche à aucun environnement, ne fait tourner aucune commande de déploiement, n'écrit aucun secret dans son compte rendu.''',
]

[workflow.party_groups.sortants]
type = '''État du socle + plan d'infrastructure priorisé par risque'''
producteur = '''playbook evolution-flotte sur le dépôt cible ; les changements d'infrastructure restent un arbitrage utilisateur'''
recette = [
  '''Chaque environnement listé porte ce qui le distingue et qui en répond.''',
  '''Le choix d'environnement de production est écrit avec ses deux alternatives écartées et la raison de leur écart.''',
  '''Chaque poste de coût cité porte la mesure qui l'établit.''',
  '''Toute procédure de reprise mentionnée dit la date de son dernier essai réel, ou est marquée jamais jouée.''',
]

