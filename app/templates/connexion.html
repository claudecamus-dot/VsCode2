<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Interview-to-Deck</title>
  {# /static/** est public (app/auth.py) : la charte s'applique avant connexion. #}
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="login-brand">Interview&#8209;to&#8209;Deck</p>
    <h1>Connexion</h1>
    <p class="muted login-intro">Cet espace contient des entretiens et des transcriptions. Il demande un mot de passe.</p>
    {% if erreur %}<p role="alert" class="login-error">{{ erreur }}</p>{% endif %}
    <form method="post" action="/connexion" class="form">
      <label for="mot_de_passe">Mot de passe</label>
      <input id="mot_de_passe" name="mot_de_passe" type="password"
             autocomplete="current-password" required autofocus
             {% if erreur %}aria-invalid="true"{% endif %}>
      <button type="submit" class="btn btn-primary login-submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
