<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Interview-to-Deck</title>
</head>
<body>
  <main style="max-width:24rem;margin:4rem auto;font-family:system-ui,sans-serif">
    <h1>Interview-to-Deck</h1>
    <p>Cet espace contient des entretiens et des transcriptions. Il demande un mot de passe.</p>
    {% if erreur %}<p role="alert" style="color:#b00020">{{ erreur }}</p>{% endif %}
    <form method="post" action="/connexion">
      <label for="mot_de_passe">Mot de passe</label>
      <input id="mot_de_passe" name="mot_de_passe" type="password"
             autocomplete="current-password" required
             style="display:block;width:100%;padding:.5rem;margin:.5rem 0 1rem">
      <button type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
