name: CI

# Exécute lint + suite de tests à chaque push sur main et sur chaque pull request.
# Introduit le 2026-07-24 (finding pratique-dev du superviseur de flotte : DORA
# « intégration continue » — VSCode2 avait tests + couverture mais aucune CI, seul
# projet Python prêt à en avoir une). Modèle : la CI JS de VSCode1.

on:
  push:
    branches: [main]
  pull_request:

# Portée du GITHUB_TOKEN, réduite au strict nécessaire (finding audit-technique
# sécurité du 2026-09-13). Sans ce bloc, le jeton hérite de la portée PAR DÉFAUT
# du dépôt — potentiellement en écriture — alors que ce workflow se déclenche sur
# `pull_request`, donc sur du code proposé de l'extérieur, et qu'il ne fait que
# lire le dépôt : checkout, install, lint, tests. Rien n'y écrit ni ne publie.
# Déclaré au niveau du workflow (et non du job) pour qu'un job ajouté demain
# hérite du minimum et doive demander explicitement ce dont il a besoin.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Borne du job (2026-09-30) : le run #48 est reste >1 h dans pytest sans
    # verdict, contre ~2 min pour les runs verts ; sans borne GitHub attend 6 h.
    timeout-minutes: 30
    steps:
      # Actions epinglees sur un SHA de commit, jamais sur un tag : un tag est
      # MUTABLE, qui controle le depot de l'action peut le re-pointer sur un
      # autre commit, execute ici avec le GITHUB_TOKEN du workflow et sur du
      # code propose de l'exterieur (`pull_request`). C'est la contrepartie,
      # cote chaine CI, des `==` deja imposes a requirements*.txt (finding
      # audit-technique securite du 2026-09-13). Le tag reste en commentaire
      # pour qu'une montee de version ne demande pas d'archeologie ; un test
      # (tests/test_ci_actions_epinglees.py) retient la derive.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Scan de vulnérabilités des dépendances (finding audit-technique sécurité
      # reconduit le 2026-09-21 : `grep -n 'pip-audit'` sur .github/workflows/
      # rendait 0 occurrence — toutes les versions sont épinglées en `==` pour la
      # reproductibilité du build, mais l'épinglage sans veille fige aussi les
      # failles une fois une version publiée vulnérable.
      #
      # INFORMATIF, pas encore un gate : `pip-audit -r requirements.txt -r
      # requirements-dev.txt`, exécuté le 2026-09-22 avant d'ajouter cette étape,
      # trouve DÉJÀ 5 vulnérabilités connues sur 2 paquets épinglés existants
      # (httpx2==2.5.0 : PYSEC-2026-3846/3847/3848/3849 ; httpcore2==2.5.0 :
      # PYSEC-2026-3844 — les deux corrigés en amont par des versions plus
      # récentes). Poser un gate bloquant maintenant rougirait la CI sur une
      # dérive déjà présente, sans rapport avec ce correctif de scan lui-même
      # (même prudence que le lint app/ le 2026-09-10 : mesurer d'abord, bumper
      # les versions et faire passer la suite est un chantier à part, hors
      # périmètre de cet ajout). `|| true` volontaire, pas un artefact
      # d'inattention — la sortie reste lisible dans les logs du job à chaque
      # run pour ne pas laisser le residuel retomber dans le silence.
      - name: Scan de vulnérabilités des dépendances (pip-audit, informatif)
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.txt -r requirements-dev.txt || true

      # Lint BLOQUANT depuis le 2026-09-10 (arbitrage utilisateur, sur constat
      # d'audit risque technique : « le lint mesure la dérive mais ne la retient
      # pas » — 74 points dans app/, dont les 11 imports morts signalés à chaque
      # exécution sans que rien ne les arrête).
      #
      # La politique « mesure d'abord, pas de gate » datait du 2026-07-23 et
      # n'avait jamais été revisitée : elle supposait une dette à résorber. Elle
      # l'est — `ruff check app/` rend 0 point. Un gate posé sur zéro ne coûte
      # rien à qui écrit du code propre, et arrête la dérive au lieu de la
      # compter. La prudence de l'époque (« un --fix aveugle avait cassé un
      # ré-export ») a été honorée : les 11 F401 ont été vérifiés un par un
      # avant correction, aucun n'était un ré-export ni cité dans un `__all__`.
      #
      # Les 6 points que `--fix` refuse de traiter seul (zip strict, variables
      # de boucle, chaînage d'exception) ont été tranchés à la main, chacun avec
      # sa raison écrite à côté — dont un `strict=False` ASSUMÉ, sur un repli
      # que la docstring interdit de faire échouer.
      # Le gate porte sur `app/` — le CODE PRODUIT, et le périmètre exact du
      # constat. Il y rend 0 point. Le reste du dépôt (tests/, outillage) en
      # comptait encore 114 le 2026-09-10 (mesuré : `ruff check .` rend 114,
      # `ruff check app/` en rend 0) : les y inclure aujourd'hui rougirait
      # la CI sans qu'aucun défaut applicatif ne soit en cause, et un gate qu'on
      # doit désactiver pour livrer ne gate rien. Ils restent mesurés par
      # l'étape informative ci-dessous, à résorber avant d'élargir le gate.
      - name: Lint (ruff, gate sur le code produit)
        run: python -m ruff check app/

      - name: Lint (ruff, reste du dépôt — informatif)
        run: python -m ruff check . || true

      # Tests = le gate. Couverture affichée (pytest-cov), sans seuil imposé —
      # même politique que VSCode1 (on mesure d'abord, gate éventuel plus tard).
      # Le parcours « premiers clics » (tests/test_e2e_premiers_clics.py) joue un
      # vrai Chrome contre un vrai uvicorn. Sans E2E_OBLIGATOIRE il se SAUTE
      # quand aucun Chromium n'est trouvé — sur cette image le navigateur est
      # présent, et une suite verte qui n'a pas joué le parcours est
      # exactement le trou que ce test existe pour fermer (2026-09-08).
      # Le navigateur est présent sur l'image ubuntu-latest — affirmé ici par
      # une commande qui échoue avec sa raison si l'image change, plutôt que
      # par une erreur de collecte qui rougirait toute la suite (revue du
      # 2026-09-09, A16).
      - name: Navigateur pour le parcours utilisateur
        run: google-chrome --version

      - name: Tests (pytest + couverture)
        timeout-minutes: 20
        env:
          E2E_OBLIGATOIRE: "1"
        # faulthandler_timeout (natif pytest) : un test bloque plus de 5 min
        # imprime la pile de tous les threads — le journal nomme le coupable.
        run: python -m pytest --cov=app --cov-report=term-missing -q -o faulthandler_timeout=300
